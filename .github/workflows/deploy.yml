# 构建 Vue 前端并部署到 GitHub Pages（免费）
#
# 首次部署前：仓库 Settings → Pages → Build and deployment → Source
# 选「GitHub Actions」，否则 deploy-pages 会报 Pages site Not Found。
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages base path
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 仓库变量 VITE_BASE 可强制覆盖（自定义域名用 /，项目页用 /仓库名/）
          if [[ -n "${{ vars.VITE_BASE }}" ]]; then
            echo "path=${{ vars.VITE_BASE }}" >> "$GITHUB_OUTPUT"
            echo "Using repository variable VITE_BASE=${{ vars.VITE_BASE }}"
            exit 0
          fi
          name="${{ github.event.repository.name }}"
          # 自定义域名挂在站点根路径，不能再用 /仓库名/
          cname="$(gh api "repos/${{ github.repository }}/pages" --jq '.cname // empty' 2>/dev/null || true)"
          if [[ "$name" == *.github.io ]] || [[ -n "$cname" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${name}/" >> "$GITHUB_OUTPUT"
          fi
          echo "custom_domain=${cname:-<none>}"

      - name: Build
        # Vite 只在构建时把 VITE_* 打进包；Secrets / Variables 都可以。
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::缺少 VITE_SUPABASE_URL 或 VITE_SUPABASE_PUBLISHABLE_KEY。请到 Settings → Secrets and variables → Actions，在 Variables 或 Secrets 里添加同名项（不要加在 Environment 以外的地方漏配）。"
            exit 1
          fi
          npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
